version: "3.9"

networks:
  meetiq_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  recordings_data:
  uploads_data:

services:

  # ─────────────────────────────────────────────
  #  PostgreSQL Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: meetiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetiq}
      POSTGRES_USER: ${POSTGRES_USER:-meetiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetiq_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    networks:
      - meetiq_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetiq_user} -d ${POSTGRES_DB:-meetiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  #  Redis — sessions, queues, pub/sub
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: meetiq_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - meetiq_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  #  Node.js — Main REST API + WebSocket
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: meetiq_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-meetiq_user}:${POSTGRES_PASSWORD:-meetiq_secret}@postgres:5432/${POSTGRES_DB:-meetiq}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      AI_SERVICE_URL: http://ai:8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - recordings_data:/app/recordings
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"
    networks:
      - meetiq_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  #  Python FastAPI — AI Microservice
  # ─────────────────────────────────────────────
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: meetiq_ai
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      TRANSCRIPTION_ENGINE: ${TRANSCRIPTION_ENGINE:-whisper}
      MODEL_CACHE_DIR: /app/models
    volumes:
      - uploads_data:/app/uploads
      - recordings_data:/app/recordings
      - ./ai-service/models:/app/models
    ports:
      - "8000:8000"
    networks:
      - meetiq_net
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 15s
      retries: 3

  # ─────────────────────────────────────────────
  #  Meeting Bot Worker (Puppeteer / Playwright)
  # ─────────────────────────────────────────────
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
    container_name: meetiq_bot
    restart: unless-stopped
    depends_on:
      - api
      - redis
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      API_URL: http://api:4000
      BOT_NAME: "MeetIQ Recorder"
      RECORDINGS_DIR: /app/recordings
      DISPLAY: ":99"
    volumes:
      - recordings_data:/app/recordings
    networks:
      - meetiq_net
    cap_add:
      - SYS_ADMIN
    shm_size: 2gb

  # ─────────────────────────────────────────────
  #  Nginx — Reverse Proxy + SSL Termination
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: meetiq_nginx
    restart: unless-stopped
    depends_on:
      - api
      - ai
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - meetiq_net

  # ─────────────────────────────────────────────
  #  Minio — Local S3-compatible storage (dev)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: meetiq_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - uploads_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - meetiq_net
    profiles:
      - dev
