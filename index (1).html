<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MeetIQ AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#070d1a;--surface:#0c1526;--card:#101d33;--elevated:#152240;
--border:#1a2d4e;--border2:#243d66;
--amber:#f5a623;--amber2:#ffbe4d;--amber-dim:rgba(245,166,35,0.12);
--cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.1);
--green:#00e676;--green-dim:rgba(0,230,118,0.1);
--red:#ff4757;--red-dim:rgba(255,71,87,0.1);
--purple:#a855f7;--purple-dim:rgba(168,85,247,0.1);
--text:#e2ecff;--text2:#7a9cc8;--text3:#3d5a82;
--fd:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'JetBrains Mono',monospace;
--r:10px;--rl:16px;--sh:0 20px 60px rgba(0,0,0,.5);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);overflow-x:hidden}
#root{display:flex;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(245,166,35,.04),transparent 60%),
radial-gradient(ellipse 60% 40% at 80% 100%,rgba(0,212,255,.04),transparent 60%)}

.sidebar{width:220px;min-width:220px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:10;overflow-y:auto}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--amber),#c97d0a);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 0 16px rgba(245,166,35,.35)}
.sb-logo-text{font-family:var(--fd);font-size:17px;font-weight:800}
.sb-logo-text span{color:var(--amber)}
.sb-badge{margin-left:auto;background:var(--amber-dim);color:var(--amber);font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;border:1px solid rgba(245,166,35,.25);letter-spacing:.5px}
.sb-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:1px}
.sb-sec{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding:12px 8px 5px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .18s;color:var(--text2);font-size:12.5px;font-weight:500;position:relative;border:1px solid transparent}
.sb-item:hover{background:var(--card);color:var(--text)}
.sb-item.active{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,166,35,.18)}
.sb-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:2.5px;background:var(--amber);border-radius:0 2px 2px 0}
.sb-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sb-chip{margin-left:auto;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px}
.c-red{background:var(--red-dim);color:var(--red)}.c-amb{background:var(--amber-dim);color:var(--amber)}.c-grn{background:var(--green-dim);color:var(--green)}
.sb-footer{padding:12px 10px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer}
.sb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sb-un{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ur{font-size:10px;color:var(--text3)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;position:relative;z-index:10}
.tb-title{font-family:var(--fd);font-size:16px;font-weight:700;flex:1}
.tb-right{display:flex;align-items:center;gap:8px}
.live-pill{display:flex;align-items:center;gap:5px;background:var(--green-dim);border:1px solid rgba(0,230,118,.2);color:var(--green);font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.5px}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 1.2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;border:none;font-family:var(--fb);letter-spacing:.2px;white-space:nowrap}
.ba{background:var(--amber);color:#000}.ba:hover{background:var(--amber2);box-shadow:0 0 18px rgba(245,166,35,.35)}
.bg{background:transparent;color:var(--text2);border:1px solid var(--border)}.bg:hover{background:var(--card);color:var(--text);border-color:var(--border2)}
.bd{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,71,87,.25)}.bd:hover{background:rgba(255,71,87,.2)}
.bc{background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.bs{padding:5px 10px;font-size:11px}.bi{width:34px;height:34px;padding:0;justify-content:center}

.content{flex:1;overflow-y:auto;padding:24px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:20px;transition:border-color .2s}
.card:hover{border-color:var(--border2)}
.c-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.c-title{font-family:var(--fd);font-size:13px;font-weight:700}
.c-sub{font-size:10px;color:var(--text3);margin-top:2px}

.hero{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:28px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(245,166,35,.08),transparent 70%);pointer-events:none}
.hero-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.hero-h{font-family:var(--fd);font-size:22px;font-weight:800;margin-bottom:6px}
.hero-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.url-row{display:flex;gap:10px;align-items:center}
.url-wrap{flex:1;display:flex;align-items:center;gap:10px;background:var(--elevated);border:1px solid var(--border2);border-radius:var(--r);padding:0 14px;transition:all .2s}
.url-wrap:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.08)}
.url-in{flex:1;background:transparent;border:none;outline:none;padding:12px 0;color:var(--text);font-size:13px;font-family:var(--fb)}
.url-in::placeholder{color:var(--text3)}
.plat-chips{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.p-chip{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--elevated);color:var(--text2);transition:all .18s}
.p-chip:hover{border-color:var(--border2);color:var(--text)}
.p-chip.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}

.mtg-container{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:20px}
.mtg-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--elevated)}
.mtg-url{flex:1;font-family:var(--fm);font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-live{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.2s infinite}
.dot-idle{background:var(--text3)}
.frame-wrap{position:relative;width:100%;background:var(--bg);display:flex;align-items:center;justify-content:center}
.frame-wrap iframe{width:100%;border:none;display:block}
.frame-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;gap:12px;text-align:center}
.frame-ph-icon{font-size:48px;opacity:.25}

.rec-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--elevated);border-top:1px solid var(--border);flex-wrap:wrap}
.rec-ind{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0}
.rec-dot.on{animation:recpulse 1s infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,.5)}50%{box-shadow:0 0 0 6px rgba(255,71,87,0)}}
.rec-timer{font-family:var(--fm);font-size:13px;color:var(--amber);font-weight:500}
.waveform{display:flex;align-items:center;gap:2px;height:24px}
.w-bar{width:3px;border-radius:2px;animation:wave 1s ease-in-out infinite;background:var(--amber);opacity:.7}
@keyframes wave{0%,100%{height:3px}50%{height:100%}}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:16px 18px;position:relative;overflow:hidden;transition:all .2s}
.stat:hover{transform:translateY(-2px);border-color:var(--border2)}
.stat-glow{position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;opacity:.08}
.stat-icon{font-size:20px;margin-bottom:8px}
.stat-val{font-family:var(--fd);font-size:26px;font-weight:800;line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:4px;font-weight:500;letter-spacing:.3px}
.stat-d{font-size:10px;margin-top:6px;font-weight:600}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:18px}

.t-line{display:grid;grid-template-columns:85px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid rgba(26,45,78,.5)}
.t-line:last-child{border-bottom:none}
.t-time{font-family:var(--fm);font-size:9px;color:var(--text3);padding-top:3px;letter-spacing:.5px}
.t-spk{font-size:10px;font-weight:700;color:var(--amber);margin-bottom:3px;letter-spacing:.3px}
.t-txt{font-size:12.5px;color:var(--text);line-height:1.55}
.t-txt.te{font-size:13.5px}
.t-lang{display:inline-block;font-size:8px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:middle;letter-spacing:.5px}
.l-te{background:var(--purple-dim);color:var(--purple)}.l-en{background:var(--cyan-dim);color:var(--cyan)}
.t-new{animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.stabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.stab{padding:9px 16px;font-size:11px;font-weight:600;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap}
.stab:hover{color:var(--text2)}.stab.on{color:var(--amber);border-bottom-color:var(--amber)}

.dec-item{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;background:var(--elevated);border-radius:var(--r);border:1px solid var(--border);margin-bottom:6px}
.dec-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0;margin-top:5px}

.act-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--elevated);border-radius:var(--r);border:1px solid var(--border);margin-bottom:7px;transition:border-color .18s}
.act-item:hover{border-color:var(--border2)}
.act-cb{width:16px;height:16px;border:2px solid var(--border2);border-radius:4px;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .18s}
.act-cb.dn{background:var(--amber);border-color:var(--amber);color:#000}
.act-task{font-size:12px;font-weight:500;color:var(--text)}
.act-task.dn{text-decoration:line-through;color:var(--text3)}
.act-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.a-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.3px}
.t-off{background:var(--purple-dim);color:var(--purple)}
.t-dl{background:var(--red-dim);color:var(--red)}
.t-dp{background:var(--cyan-dim);color:var(--cyan)}
.t-pc{background:rgba(255,71,87,.18);color:var(--red)}
.t-ph{background:var(--amber-dim);color:var(--amber)}
.t-pm{background:var(--green-dim);color:var(--green)}

.m-card{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--elevated);border-radius:var(--r);border:1px solid var(--border);cursor:pointer;transition:all .18s;margin-bottom:8px}
.m-card:hover{border-color:var(--border2);transform:translateX(2px)}
.m-plat{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pz{background:rgba(35,113,244,.15);border:1px solid rgba(35,113,244,.3)}
.pm{background:rgba(0,172,76,.15);border:1px solid rgba(0,172,76,.3)}
.pt{background:rgba(100,65,180,.15);border:1px solid rgba(100,65,180,.3)}
.pw{background:var(--cyan-dim);border:1px solid rgba(0,212,255,.2)}
.m-info{flex:1;min-width:0}
.m-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-meta{font-size:10px;color:var(--text3);margin-top:3px;display:flex;gap:10px}
.pill-done{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.pill-live{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--green-dim);color:var(--green);border:1px solid rgba(0,230,118,.2)}

.searchbar{display:flex;align-items:center;gap:8px;background:var(--elevated);border:1px solid var(--border);border-radius:var(--r);padding:0 14px;transition:all .2s;margin-bottom:16px}
.searchbar:focus-within{border-color:var(--amber)}
.searchbar input{flex:1;background:transparent;border:none;outline:none;padding:10px 0;font-size:12.5px;color:var(--text);font-family:var(--fb)}
.searchbar input::placeholder{color:var(--text3)}

.prog{height:4px;background:var(--elevated);border-radius:2px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:2px;transition:width .6s ease}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);padding:28px;width:100%;max-width:520px;animation:suUp .25s ease}
@keyframes suUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-family:var(--fd);font-size:18px;font-weight:800;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:22px}
.fl{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.fi{width:100%;background:var(--elevated);border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;color:var(--text);font-size:13px;font-family:var(--fb);outline:none;transition:all .2s}
.fi:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,166,35,.08)}
.m-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}

.notif-pan{position:fixed;top:56px;right:16px;width:320px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);box-shadow:var(--sh);z-index:150;overflow:hidden;animation:sdDn .2s ease}
@keyframes sdDn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.notif-hd{padding:14px 16px;border-bottom:1px solid var(--border);font-family:var(--fd);font-size:13px;font-weight:700}
.n-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(26,45,78,.5);cursor:pointer;transition:background .15s}
.n-item:hover{background:var(--elevated)}
.n-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

.chat-wrap{display:flex;flex-direction:column;height:400px}
.chat-msgs{flex:1;overflow-y:auto;padding:4px 0;display:flex;flex-direction:column;gap:10px}
.chat-msg{display:flex;gap:8px;align-items:flex-start}
.chat-msg.user{flex-direction:row-reverse}
.chat-av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.av-ai{background:linear-gradient(135deg,var(--amber),#c97d0a)}.av-u{background:linear-gradient(135deg,var(--purple),var(--cyan))}
.bub{max-width:82%;padding:9px 13px;border-radius:12px;font-size:12px;line-height:1.55;white-space:pre-line}
.bub-ai{background:var(--elevated);border:1px solid var(--border);color:var(--text)}
.bub-u{background:var(--amber-dim);border:1px solid rgba(245,166,35,.2);color:var(--text)}
.chat-ir{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.chat-sugs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chat-sug{font-size:10px;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--border2);color:var(--text2);background:var(--elevated);transition:all .15s;white-space:nowrap}
.chat-sug:hover{border-color:var(--amber);color:var(--amber)}

.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(26,45,78,.5)}
.set-row:last-child{border-bottom:none}
.set-lbl{font-size:13px;font-weight:500}
.set-desc{font-size:11px;color:var(--text3);margin-top:2px}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--elevated);border:1px solid var(--border2);cursor:pointer;position:relative;transition:all .2s;flex-shrink:0}
.toggle.on{background:var(--amber);border-color:var(--amber)}
.t-knob{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle.on .t-knob{left:21px}

.bar-chart{display:flex;align-items:flex-end;gap:8px;height:100px;padding-top:10px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bar-rect{width:100%;border-radius:3px 3px 0 0;transition:height .5s ease;min-height:4px}
.bar-lbl{font-size:9px;color:var(--text3);white-space:nowrap}

.copy-flash{position:fixed;bottom:20px;right:20px;background:var(--green);color:#000;padding:8px 16px;border-radius:var(--r);font-size:12px;font-weight:700;animation:suUp .2s ease;z-index:999}

@media(max-width:900px){.sidebar{display:none}.stats-row{grid-template-columns:repeat(2,1fr)}.g2,.g21{grid-template-columns:1fr}}
@media(max-width:600px){.content{padding:14px}.g3{grid-template-columns:1fr 1fr}.url-row{flex-direction:column}}
select,input[type=range]{cursor:pointer}
input[type=range]{accent-color:var(--amber);width:100%}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;

const PI={zoom:"🎥",meet:"🟢",teams:"🔵",webex:"⚡"};
const PL={zoom:"Zoom",meet:"Google Meet",teams:"Teams",webex:"WebEx"};

function Prog({pct,color="#f5a623"}){
  return <div className="prog"><div className="prog-fill" style={{width:pct+"%",background:color}}/></div>;
}
function Toggle({on,onChange}){
  return <div className={"toggle"+(on?" on":"")} onClick={()=>onChange(!on)}><div className="t-knob"/></div>;
}
function PTag({p}){
  const m={Critical:"t-pc",High:"t-ph",Medium:"t-pm"};
  return <span className={"a-tag "+(m[p]||"t-pm")}>{p}</span>;
}

/* TRANSCRIPT */
function TranscriptPage(){
  const [srch,setSrch]=useState("");
  const [filt,setFilt]=useState("all");
  const [copied,setCopied]=useState(false);
  const rows=useMemo(()=>TRANSCRIPT.filter(l=>{
    const ms=!srch||l.text.toLowerCase().includes(srch.toLowerCase())||l.speaker.toLowerCase().includes(srch.toLowerCase());
    const mf=filt==="all"||(filt==="en"&&l.lang==="en")||(filt==="te"&&l.lang==="te");
    return ms&&mf;
  }),[srch,filt]);
  const copy=()=>{
    navigator.clipboard.writeText(TRANSCRIPT.map(l=>`[${l.time}] ${l.speaker}: ${l.text}`).join("\n"));
    setCopied(true);setTimeout(()=>setCopied(false),2000);
  };
  return(
    <div className="content">
      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center",flexWrap:"wrap"}}>
        <div className="searchbar" style={{flex:1,marginBottom:0}}>
          <span style={{color:"var(--text3)"}}>🔍</span>
          <input placeholder="Search transcript…" value={srch} onChange={e=>setSrch(e.target.value)}/>
          {srch&&<span style={{cursor:"pointer",color:"var(--text3)"}} onClick={()=>setSrch("")}>✕</span>}
        </div>
        {["all","en","te"].map(f=>(
          <button key={f} className={"btn bs "+(filt===f?"ba":"bg")} onClick={()=>setFilt(f)}>
            {f==="all"?"All":f==="en"?"English":"తెలుగు"}
          </button>
        ))}
      </div>
      <div className="card">
        <div className="c-hd">
          <div><div className="c-title">📝 Full Transcript</div><div className="c-sub">{rows.length} segments</div></div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn bg bs" onClick={copy}>📋 Copy</button>
            <button className="btn bg bs">⬇ PDF</button>
            <button className="btn bg bs">⬇ TXT</button>
          </div>
        </div>
        {rows.length===0
          ? <div style={{textAlign:"center",padding:"40px 0",color:"var(--text3)"}}>No results for "{srch}"</div>
          : rows.map(l=>(
              <div key={l.id} className="t-line">
                <div className="t-time">{l.time}</div>
                <div>
                  <div className="t-spk">{l.speaker} <span className={"t-lang l-"+l.lang}>{l.lang.toUpperCase()}</span></div>
                  <div className={"t-txt"+(l.lang==="te"?" te":"")}>
                    {srch
                      ? l.text.split(new RegExp("("+srch+")","i")).map((p,j)=>
                          p.toLowerCase()===srch.toLowerCase()
                            ? <mark key={j} style={{background:"var(--amber)",color:"#000",borderRadius:3}}>{p}</mark>
                            : p
                        )
                      : l.text}
                  </div>
                </div>
              </div>
            ))
        }
      </div>
      {copied&&<div className="copy-flash">✓ Copied!</div>}
    </div>
  );
}

function AIChat(){

  const send=txt=>{
    const q=txt||inp;
    if(!q.trim())return;
    setInp("");
    setMsgs(p=>[...p,{role:"user",text:q}]);
    setThinking(true);
    setTimeout(()=>{
      const r={
        "summarize":"**District Health Review – Q2 2026**\n\nVaccination: Urban 68%, Rural 42%. Cold chain failures in 3 mandals. Camps planned May 18–22. Budget ₹2.4L approved.",
        "pending":"**4 pending action items:**\n\n1. 🔴 Fix cold chain — Ravi (May 16)\n2. 🔴 Procure vaccines — Store Mgr (May 17)\n3. 🟡 Vaccination camps — Mrs. Lakshmi (May 20)\n4. 🟡 ASHA campaign — CHO Sunitha (May 22)",

        "pdf":"PDF generation queued!\n✓ Full transcript\n✓ AI summary (EN + Telugu)\n✓ Minutes of Meeting\n✓ Action items\n\nReady in ~30 seconds.",
      };
      const k=Object.keys(r).find(k=>q.toLowerCase().includes(k));
      setMsgs(p=>[...p,{role:"ai",text:k?r[k]:"I found relevant info. Try asking for 'summary', 'pending actions', 'telugu', or 'pdf'."}]);
      setThinking(false);
    },1200);
  };
  return(
    <div className="content">
      <div className="card">
        <div className="c-hd" style={{marginBottom:12}}>
          <div className="c-title">⚡ AI Meeting Assistant</div>
          <div style={{display:"flex",gap:5,alignItems:"center"}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:"var(--green)",animation:"blink 1.2s infinite"}}/>
            <span style={{fontSize:10,color:"var(--green)",fontWeight:700}}>ONLINE</span>
          </div>
        </div>
        <div className="chat-sugs">
          {["Summarize meeting","List pending actions","Telugu summary","Generate PDF","Key decisions","Who spoke most?"].map(s=>(
            <div key={s} className="chat-sug" onClick={()=>send(s)}>{s}</div>
          ))}
        </div>
        <div className="chat-wrap">
          <div className="chat-msgs">
            {msgs.map((m,i)=>(
              <div key={i} className={"chat-msg"+(m.role==="user"?" user":"")}>
                <div className={"chat-av "+(m.role==="ai"?"av-ai":"av-u")}>{m.role==="ai"?"🧠":"U"}</div>
                <div className={"bub "+(m.role==="ai"?"bub-ai":"bub-u")}>{m.text}</div>
              </div>
            ))}
            {thinking&&(
              <div className="chat-msg">
                <div className="chat-av av-ai">🧠</div>
                <div className="bub bub-ai" style={{display:"flex",gap:5,alignItems:"center"}}>
                  {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:"var(--amber)",animation:"blink 1s infinite",animationDelay:i*0.2+"s"}}/>)}

            <div ref={ref}/>

          <div className="chat-ir">
            <input className="fi" style={{flex:1}} value={inp} onChange={e=>setInp(e.target.value)}

  );

/* APP */
function App(){
  const [pg,setPg]=useState("home");
  const [url,setUrl]=useState("");
  const [plat,setPlat]=useState("zoom");
  const [showNotif,setShowNotif]=useState(false);
  const [isRec,setIsRec]=useState(false);
  const [secs,setSecs]=useState(0);
  const [audioLv,setAudioLv]=useState(6);
  const [liveTx,setLiveTx]=useState(TRANSCRIPT.slice(0,3));

  useEffect(()=>{
    let t;
    if(isRec){t=setInterval(()=>setSecs(p=>p+1),1000);}
    else setSecs(0);
    return()=>clearInterval(t);
  },[isRec]);

  useEffect(()=>{
    if(!isRec)return;
    const t=setInterval(()=>setAudioLv(Math.floor(2+Math.random()*9)),150);
    return()=>clearInterval(t);
  },[isRec]);

  useEffect(()=>{
    if(!isRec)return;
    let idx=3;
    const t=setInterval(()=>{
      if(idx<TRANSCRIPT.length)setLiveTx(p=>[...p,TRANSCRIPT[idx++]]);
      else clearInterval(t);
    },4000);
    return()=>clearInterval(t);
  },[isRec]);

  const onJoin=(u,p)=>{setUrl(u);setPlat(p);};

  const pages={
    home:<Home setPg={setPg} url={url} setUrl={setUrl} onJoin={onJoin}/>,
    live:<LiveSession url={url} plat={plat} isRec={isRec} setIsRec={setIsRec} secs={secs} liveTx={liveTx} audioLv={audioLv}/>,
    transcript:<TranscriptPage/>,
    summary:<SummaryPage/>,
    mom:<MoMPage/>,
    slides:<SlidesPage/>,
    archive:<Archive/>,
    actions:<ActionItems/>,
    analytics:<Analytics/>,
    chat:<AIChat/>,
    settings:<Settings/>,
  };

  return(
    <>
      <Sidebar pg={pg} setPg={setPg}/>
      <div className="main">
        <TopBar title={TITLES[pg]||"MeetIQ AI"} setShowNotif={setShowNotif} isRec={isRec} secs={secs}/>
        {pages[pg]||pages.home}
      </div>
      {showNotif&&<>
        <NotifPanel/>
        <div style={{position:"fixed",inset:0,zIndex:140}} onClick={()=>setShowNotif(false)}/>
      </>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
