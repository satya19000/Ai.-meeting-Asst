<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<meta name="description" content="MeetIQ AI - AI-Powered Meeting Intelligence Platform">
<title>MeetIQ AI – Meeting Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-deep:#060c1a;
  --bg-surface:#0d1528;
  --bg-card:#111d35;
  --bg-elevated:#162040;
  --border:#1e2d4a;
  --border-bright:#2a3f6a;
  --accent:#f5a623;
  --accent-dim:#c47d0e;
  --accent-glow:rgba(245,166,35,0.15);
  --cyan:#00d4ff;
  --cyan-dim:rgba(0,212,255,0.1);
  --green:#00e676;
  --red:#ff4757;
  --purple:#7c4dff;
  --text-primary:#e8edf7;
  --text-secondary:#7a8fb5;
  --text-muted:#3d5070;
  --font-display:'Syne',sans-serif;
  --font-body:'Outfit',sans-serif;
  --font-mono:'DM Mono',monospace;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow-glow:0 0 40px rgba(245,166,35,0.08);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg-deep)}
::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:2px}
#root{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:240px;
  min-height:100vh;
  background:var(--bg-surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:fixed;
  left:0;top:0;bottom:0;
  z-index:100;
  transition:transform .3s ease;
}
.sidebar-logo{
  padding:24px 20px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.logo-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--accent),#e8891a);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  box-shadow:0 0 20px rgba(245,166,35,0.3);
}
.logo-text{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-0.5px}
.logo-text span{color:var(--accent)}
.logo-badge{font-size:9px;background:var(--accent);color:#000;padding:1px 5px;border-radius:4px;font-weight:700;letter-spacing:0.5px;margin-left:4px;align-self:flex-start;margin-top:3px}

.sidebar-nav{flex:1;padding:12px 12px;overflow-y:auto}
.nav-section{margin-bottom:20px}
.nav-label{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding:0 8px;margin-bottom:6px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:all .2s;
  color:var(--text-secondary);
  font-size:13px;font-weight:500;
  position:relative;
  margin-bottom:2px;
}
.nav-item:hover{background:var(--bg-card);color:var(--text-primary)}
.nav-item.active{background:var(--accent-glow);color:var(--accent);border:1px solid rgba(245,166,35,0.2)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--accent);color:#000;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px}
.nav-badge.red{background:var(--red)}
.nav-badge.green{background:var(--green)}

.sidebar-footer{
  padding:14px 16px;
  border-top:1px solid var(--border);
}
.user-card{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  background:var(--bg-card);
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  cursor:pointer;
}
.user-avatar{
  width:32px;height:32px;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  flex-shrink:0;
}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10px;color:var(--text-muted)}

/* MAIN CONTENT */
.main-content{
  margin-left:240px;
  flex:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.topbar{
  height:60px;
  background:var(--bg-surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 28px;
  position:sticky;top:0;z-index:50;
  gap:16px;
}
.topbar-title{font-family:var(--font-display);font-size:18px;font-weight:700;flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;
  border-radius:var(--radius-sm);
  font-size:12px;font-weight:600;
  cursor:pointer;
  transition:all .2s;
  border:none;
  font-family:var(--font-body);
  letter-spacing:0.3px;
}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:#f5b83a;box-shadow:0 0 20px rgba(245,166,35,0.3)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg-card);color:var(--text-primary);border-color:var(--border-bright)}
.btn-danger{background:rgba(255,71,87,0.15);color:var(--red);border:1px solid rgba(255,71,87,0.3)}
.btn-danger:hover{background:rgba(255,71,87,0.25)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;font-size:16px}

.page-content{padding:28px;flex:1}

/* STATUS PILL */
.status-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;
  font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;
}
.status-live{background:rgba(0,230,118,0.12);color:var(--green);border:1px solid rgba(0,230,118,0.3)}
.status-live::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite}
.status-pending{background:rgba(245,166,35,0.12);color:var(--accent);border:1px solid rgba(245,166,35,0.3)}
.status-done{background:rgba(0,212,255,0.1);color:var(--cyan);border:1px solid rgba(0,212,255,0.2)}
.status-error{background:rgba(255,71,87,0.1);color:var(--red);border:1px solid rgba(255,71,87,0.2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* CARDS */
.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  transition:border-color .2s;
}
.card:hover{border-color:var(--border-bright)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--text-primary)}
.card-subtitle{font-size:11px;color:var(--text-muted);margin-top:2px}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 20px;
  position:relative;overflow:hidden;
  transition:all .25s;
}
.stat-card:hover{transform:translateY(-2px);border-color:var(--border-bright);box-shadow:var(--shadow)}
.stat-card::after{
  content:'';position:absolute;top:0;right:0;
  width:80px;height:80px;
  border-radius:50%;
  transform:translate(30%,-30%);
  opacity:0.06;
}
.stat-card.amber::after{background:var(--accent)}
.stat-card.cyan::after{background:var(--cyan)}
.stat-card.green::after{background:var(--green)}
.stat-card.purple::after{background:var(--purple)}
.stat-icon{font-size:24px;margin-bottom:10px}
.stat-value{font-family:var(--font-display);font-size:28px;font-weight:800;line-height:1}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:500}
.stat-delta{font-size:10px;margin-top:8px;font-weight:600}
.stat-delta.up{color:var(--green)}
.stat-delta.down{color:var(--red)}

/* GRID LAYOUTS */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-1-2{display:grid;grid-template-columns:1fr 2fr;gap:20px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:20px}

/* TABLES */
.table-wrap{overflow:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{background:var(--bg-elevated);padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border)}
td{padding:12px 14px;font-size:12px;border-bottom:1px solid rgba(30,45,74,0.5);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}

/* FORM ELEMENTS */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;letter-spacing:0.3px;text-transform:uppercase}
.form-input,.form-select,.form-textarea{
  width:100%;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 14px;
  color:var(--text-primary);
  font-size:13px;
  font-family:var(--font-body);
  transition:border-color .2s,box-shadow .2s;
  outline:none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(245,166,35,0.1);
}
.form-textarea{resize:vertical;min-height:80px}
.form-select option{background:var(--bg-surface)}
.input-with-icon{position:relative}
.input-with-icon .form-input{padding-left:38px}
.input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{
  padding:10px 18px;
  font-size:12px;font-weight:600;
  cursor:pointer;
  color:var(--text-muted);
  border-bottom:2px solid transparent;
  transition:all .2s;
  white-space:nowrap;
}
.tab:hover{color:var(--text-secondary)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* TRANSCRIPT */
.transcript-line{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid rgba(30,45,74,0.4);
}
.transcript-time{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);padding-top:2px}
.transcript-speaker{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}
.transcript-text{font-size:13px;color:var(--text-primary);line-height:1.5}
.transcript-text.telugu{font-size:14px}

/* ACTION ITEM */
.action-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;
  background:var(--bg-elevated);
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  margin-bottom:8px;
  transition:border-color .2s;
}
.action-item:hover{border-color:var(--border-bright)}
.action-checkbox{
  width:16px;height:16px;
  border:2px solid var(--border-bright);
  border-radius:4px;
  flex-shrink:0;margin-top:1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.action-checkbox.checked{background:var(--accent);border-color:var(--accent);color:#000;font-size:10px}
.action-details{flex:1}
.action-task{font-size:12px;font-weight:500;color:var(--text-primary)}
.action-meta{display:flex;gap:8px;margin-top:4px}
.action-tag{font-size:10px;padding:1px 7px;border-radius:4px;font-weight:600}
.tag-officer{background:rgba(124,77,255,0.15);color:#a87fff}
.tag-deadline{background:rgba(255,71,87,0.12);color:var(--red)}
.tag-dept{background:var(--cyan-dim);color:var(--cyan)}
.tag-priority{background:rgba(245,166,35,0.12);color:var(--accent)}

/* MEETING CARD */
.meeting-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  display:flex;align-items:center;gap:14px;
  transition:all .2s;
  cursor:pointer;
  margin-bottom:10px;
}
.meeting-card:hover{border-color:var(--border-bright);transform:translateX(2px)}
.meeting-platform{
  width:40px;height:40px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  flex-shrink:0;
}
.platform-zoom{background:rgba(35,113,244,0.15);border:1px solid rgba(35,113,244,0.3)}
.platform-meet{background:rgba(0,172,76,0.15);border:1px solid rgba(0,172,76,0.3)}
.platform-teams{background:rgba(100,65,180,0.15);border:1px solid rgba(100,65,180,0.3)}
.platform-webex{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2)}
.meeting-info{flex:1;min-width:0}
.meeting-title{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meeting-meta{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;gap:10px}
.meeting-actions{display:flex;gap:6px;flex-shrink:0}

/* WAVEFORM */
.waveform{
  display:flex;align-items:center;gap:2px;
  height:32px;
}
.wave-bar{
  width:3px;
  background:var(--accent);
  border-radius:2px;
  animation:wave 1s ease-in-out infinite;
  opacity:0.7;
}
@keyframes wave{
  0%,100%{height:4px}
  50%{height:100%}
}

/* PROGRESS */
.progress-bar{
  height:4px;
  background:var(--bg-elevated);
  border-radius:2px;
  overflow:hidden;
  margin-top:6px;
}
.progress-fill{
  height:100%;
  border-radius:2px;
  transition:width .5s ease;
}

/* AI CHAT */
.chat-container{display:flex;flex-direction:column;height:420px}
.chat-messages{flex:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:10px}
.chat-msg{display:flex;gap:10px;align-items:flex-start}
.chat-msg.user{flex-direction:row-reverse}
.chat-avatar{
  width:28px;height:28px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
}
.chat-ai-avatar{background:linear-gradient(135deg,var(--accent),#e8891a)}
.chat-user-avatar{background:linear-gradient(135deg,var(--purple),var(--cyan))}
.chat-bubble{
  max-width:80%;
  padding:10px 14px;
  border-radius:12px;
  font-size:12px;line-height:1.5;
}
.chat-ai{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary)}
.chat-user-msg{background:rgba(245,166,35,0.15);border:1px solid rgba(245,166,35,0.25);color:var(--text-primary)}
.chat-input-row{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}

/* SLIDE CAPTURE */
.slide-item{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
  transition:all .2s;
  cursor:pointer;
}
.slide-item:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(245,166,35,0.1)}
.slide-preview{
  aspect-ratio:16/9;
  background:linear-gradient(135deg,#1a2540,#0d1528);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.slide-preview::before{
  content:'';
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 10px,
    rgba(255,255,255,0.01) 10px,
    rgba(255,255,255,0.01) 20px
  );
}
.slide-num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.6);color:var(--accent);font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;font-family:var(--font-mono)}
.slide-label{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(0,0,0,0.7);color:var(--text-secondary);font-size:9px;padding:3px 7px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide-info{padding:10px}
.slide-title-text{font-size:11px;font-weight:600;color:var(--text-primary)}
.slide-disc{font-size:10px;color:var(--text-muted);margin-top:3px;line-height:1.4}

/* SEARCH */
.search-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:0 14px;
  transition:border-color .2s;
}
.search-bar:focus-within{border-color:var(--accent)}
.search-bar input{
  flex:1;background:transparent;border:none;
  padding:10px 0;color:var(--text-primary);font-size:13px;
  font-family:var(--font-body);outline:none;
}
.search-bar input::placeholder{color:var(--text-muted)}

/* NOTIFICATION BADGE */
.notif-dot{
  position:absolute;
  top:6px;right:6px;
  width:8px;height:8px;
  background:var(--red);
  border-radius:50%;
  border:2px solid var(--bg-surface);
}

/* TIMELINE */
.timeline-item{
  display:flex;gap:14px;
  padding:12px 0;
  position:relative;
}
.timeline-item::before{
  content:'';
  position:absolute;
  left:19px;top:44px;bottom:-12px;
  width:1px;background:var(--border);
}
.timeline-item:last-child::before{display:none}
.timeline-dot{
  width:10px;height:10px;
  border-radius:50%;
  flex-shrink:0;
  margin-top:6px;
  border:2px solid;
}
.tl-done{border-color:var(--green);background:rgba(0,230,118,0.2)}
.tl-active{border-color:var(--accent);background:rgba(245,166,35,0.2);animation:pulse 1.5s infinite}
.tl-pending{border-color:var(--border-bright);background:transparent}
.timeline-body{flex:1}
.timeline-title{font-size:12px;font-weight:600;color:var(--text-primary)}
.timeline-time{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px}
.timeline-note{font-size:11px;color:var(--text-secondary);margin-top:3px}

/* TOGGLE */
.toggle-wrap{display:flex;align-items:center;gap:8px}
.toggle{
  width:36px;height:20px;
  background:var(--border-bright);
  border-radius:10px;
  position:relative;cursor:pointer;
  transition:background .2s;
  flex-shrink:0;
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:'';
  width:14px;height:14px;
  background:#fff;border-radius:50%;
  position:absolute;top:3px;left:3px;
  transition:left .2s;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.toggle.on::after{left:19px}
.toggle-label{font-size:12px;color:var(--text-secondary)}

/* ANIMATIONS */
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.animate-fade-up{animation:fadeInUp .4s ease both}
.anim-d1{animation-delay:.05s}
.anim-d2{animation-delay:.1s}
.anim-d3{animation-delay:.15s}
.anim-d4{animation-delay:.2s}
.anim-d5{animation-delay:.25s}

/* RECORDING INDICATOR */
.rec-indicator{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;
  background:rgba(255,71,87,0.12);
  border:1px solid rgba(255,71,87,0.3);
  border-radius:20px;
  font-size:10px;font-weight:700;color:var(--red);
  letter-spacing:0.5px;
}
.rec-dot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:pulse 1s infinite}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(6,12,26,0.85);
  backdrop-filter:blur(4px);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s;
}
.modal{
  background:var(--bg-card);
  border:1px solid var(--border-bright);
  border-radius:16px;
  padding:28px;
  width:min(560px,90vw);
  max-height:85vh;overflow-y:auto;
  animation:fadeInUp .25s;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-family:var(--font-display);font-size:18px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--text-primary)}

/* PLATFORM CHIPS */
.platform-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.platform-chip{
  padding:6px 12px;border-radius:20px;
  font-size:11px;font-weight:600;
  border:1px solid var(--border);
  cursor:pointer;
  transition:all .2s;
  display:flex;align-items:center;gap:5px;
}
.platform-chip:hover,.platform-chip.selected{border-color:var(--accent);background:var(--accent-glow);color:var(--accent)}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:16px 0}
.divider-text{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:11px;margin:16px 0}
.divider-text::before,.divider-text::after{content:'';flex:1;height:1px;background:var(--border)}

/* LANGUAGE BADGE */
.lang-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:4px;
  font-size:9px;font-weight:700;letter-spacing:0.5px;
}
.lang-en{background:rgba(0,212,255,0.1);color:var(--cyan);border:1px solid rgba(0,212,255,0.2)}
.lang-te{background:rgba(245,166,35,0.12);color:var(--accent);border:1px solid rgba(245,166,35,0.25)}

/* MOBILE RESPONSIVE */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main-content{margin-left:0}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-1-2,.grid-2-1{grid-template-columns:1fr}
  .topbar-title{font-size:14px}
}

/* GLOW EFFECTS */
.glow-amber{box-shadow:0 0 30px rgba(245,166,35,0.15)}
.glow-cyan{box-shadow:0 0 30px rgba(0,212,255,0.1)}

/* AI PROCESSING */
.ai-thinking{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text-muted);
  font-family:var(--font-mono);
}
.dot-blink{animation:pulse .8s infinite}
.dot-blink:nth-child(2){animation-delay:.2s}
.dot-blink:nth-child(3){animation-delay:.4s}

/* TOOLTIP */
[data-tip]{position:relative}
[data-tip]:hover::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--bg-elevated);border:1px solid var(--border);
  color:var(--text-secondary);font-size:10px;padding:4px 8px;border-radius:4px;
  white-space:nowrap;z-index:99;pointer-events:none;
}

/* SPINNER */
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(245,166,35,0.2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:inline-block;
}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:48px 24px;
  color:var(--text-muted);
}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.4}
.empty-text{font-size:13px}

/* EXPORT BUTTONS */
.export-row{display:flex;gap:8px;flex-wrap:wrap}

/* DONUT CHART */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-svg{flex-shrink:0}
.donut-legend{flex:1}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px;color:var(--text-secondary)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* RESPONSIVE GRID */
@media(min-width:1280px){
  .stats-grid{grid-template-columns:repeat(5,1fr)}
}

function ToggleRow({label,defaultOn=true}){
  const [on,setOn]=useState(defaultOn);
  return(
    <div className="toggle-wrap">
      <div className={`toggle${on?" on":""}`} onClick={()=>setOn(p=>!p)}></div>
      <span className="toggle-label">{label}</span>
    </div>
  );
}

/* LIVE SESSION */
function LiveSession(){
  const [elapsed,setElapsed]=useState(1421);
  useEffect(()=>{const t=setInterval(()=>setElapsed(p=>p+1),1000);return()=>clearInterval(t)},[]);
  const fmt=s=>`${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor((s%3600)/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const [lines,setLines]=useState(TRANSCRIPT_DATA.slice(0,3));
  useEffect(()=>{
    let idx=3;
    const t=setInterval(()=>{
      if(idx<TRANSCRIPT_DATA.length){setLines(p=>[...p,TRANSCRIPT_DATA[idx]]);idx++;}
    },3500);
    return()=>clearInterval(t);
  },[]);

  return(
    <div>
      {/* LIVE HEADER */}
      <div className="card glow-cyan animate-fade-up" style={{background:"linear-gradient(135deg,rgba(0,212,255,0.05),rgba(0,0,0,0))",borderColor:"rgba(0,212,255,0.3)",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <span className="rec-indicator"><span className="rec-dot"></span>RECORDING</span>
              <span className="status-pill status-live">● LIVE</span>
              <span style={{fontFamily:"var(--font-mono)",fontSize:13,color:"var(--accent)"}}>{fmt(elapsed)}</span>
            </div>
            <div style={{fontFamily:"var(--font-display)",fontSize:18,fontWeight:700}}>Vaccination Drive Coordination</div>
            <div style={{fontSize:12,color:"var(--text-muted)",marginTop:4}}>Google Meet · 8 participants · Bot: MeetIQ Recorder</div>
          </div>
          <div className="waveform" style={{height:48}}>
            {Array.from({length:20},(_,i)=>(
              <div key={i} className="wave-bar" style={{animationDelay:i*0.05+"s",animationDuration:(0.5+Math.random()*0.8)+"s"}}></div>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-ghost btn-sm">⏸ Pause</button>
            <button className="btn btn-danger btn-sm">⏹ End Session</button>
          </div>
        </div>
      </div>

      <div className="grid-2-1">
        {/* LIVE TRANSCRIPT */}
        <div className="card animate-fade-up anim-d1">
          <div className="card-header">
            <div>
              <div className="card-title">📝 Live Transcript</div>
              <div className="card-subtitle">AI Whisper · Speaker Diarization Active</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <span className="lang-badge lang-en">EN</span>
              <span className="lang-badge lang-te">తె</span>
            </div>
          </div>
          <div style={{maxHeight:480,overflowY:"auto"}}>
            {lines.map((l,i)=>(
              <div key={i} className="transcript-line" style={{animation:i===lines.length-1?"fadeInUp .4s ease":"none"}}>
                <div>
                  <div className="transcript-time">{l.time}</div>
                  <span className={`lang-badge ${l.lang==="te"?"lang-te":"lang-en"}`}>{l.lang==="te"?"తె":"EN"}</span>
                </div>
                <div>
                  <div className="transcript-speaker">{l.speaker}</div>
                  <div className={`transcript-text${l.lang==="te"?" telugu":""}`}>{l.text}</div>

            <div className="ai-thinking" style={{padding:"12px 0"}}>

              <span className="dot-blink" style={{fontSize:18,lineHeight:1}}>●</span>

            {["DIO Mrs. Lakshmi","DMHO Dr. Rao","Field Officer Ravi","CHO Sunitha","Store Manager","Dr. Prasad","Nurse Kavitha","🤖 MeetIQ Recorder"].map((p,i)=>(

                {icon:"⚠️",text:"Action detected: Camp arrangement by DIO",color:"var(--accent)"},
                {icon:"📍",text:"Locations mentioned: Vikarabad, Medchal",color:"var(--green)"},

/* ACTIONS */
function ActionItems(){
  const [actions,setActions]=useState(ACTION_ITEMS);
  const [filter,setFilter]=useState("all");
  const toggle=(id)=>setActions(a=>a.map(x=>x.id===id?{...x,done:!x.done}:x));
  const filtered=filter==="all"?actions:filter==="pending"?actions.filter(a=>!a.done):actions.filter(a=>a.done);
  return(
    <div>
      <div className="card animate-fade-up" style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {[["all","All"],["pending","Pending"],["done","Completed"]].map(([v,l])=>(
            <button key={v} className={`btn btn-sm${filter===v?" btn-primary":" btn-ghost"}`} onClick={()=>setFilter(v)}>{l}</button>
          ))}
          <span style={{marginLeft:"auto",fontSize:12,color:"var(--text-muted)"}}>{actions.filter(a=>!a.done).length} pending · {actions.filter(a=>a.done).length} done</span>
        </div>
      </div>
      <div className="card animate-fade-up anim-d1">
        <div className="card-header">
          <div>
            <div className="card-title">Action Items Tracker</div>
            <div className="card-subtitle">AI-extracted from all meetings · Assigned to officers</div>
          </div>
          <button className="btn btn-ghost btn-sm">📥 Export</button>
        </div>
        {filtered.map(a=>(
          <div key={a.id} className="action-item">
            <div className={`action-checkbox${a.done?" checked":""}`} onClick={()=>toggle(a.id)}>{a.done?"✓":""}</div>
            <div className="action-details">
              <div className="action-task" style={a.done?{textDecoration:"line-through",opacity:0.5}:{}}>{a.task}</div>
              <div className="action-meta">
                <span className="action-tag tag-officer">👤 {a.officer}</span>
                <span className="action-tag tag-deadline">⏰ {a.deadline}</span>
                <span className="action-tag tag-dept">🏢 {a.dept}</span>
                <span className={`action-tag ${a.priority==="Critical"?"tag-deadline":"tag-priority"}`}>{a.priority}</span>
              </div>
            </div>
            <button className="btn btn-ghost btn-sm">Send Reminder</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* AI CHAT */
function AIChat(){
  const [msgs,setMsgs]=useState(CHAT_INIT);
  const [input,setInput]=useState("");
  const [typing,setTyping]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[msgs,typing]);

  const aiResponses={
    "summarize":
      "**Today's Meeting Summary:**\n\nThe Vaccination Drive Coordination meeting (ongoing) covers rural immunization gaps. Key discussion: special camps in Vikarabad by May 20, cold chain repair deadline May 16.\n\nFor detailed summary → go to **AI Summaries** section.",
    "pending":
      "**4 Pending Action Items:**\n\n1. 🔴 Fix cold chain failures — Field Officer Ravi — Due: **May 16**\n2. 🔴 Procure 5000 vaccine vials — Store Manager — Due: **May 17**\n3. 🟠 Vaccination camps in Vikarabad — DIO Mrs. Lakshmi — Due: **May 20**\n4. 🟡 ASHA door-to-door campaign — CHO Sunitha — Due: **May 22**",
    "telugu":
      "**తెలుగు అనువాదం సిద్ధంగా ఉంది:**\n\nవ్యాక్సినేషన్ డ్రైవ్ సమన్వయ సమావేశంలో గ్రామీణ ప్రాంతాల్లో టీకాల కవరేజ్ పై చర్చించారు. వికారాబాద్ మరియు మేడ్చల్ లో మే 20 నాటికి ప్రత్యేక శిబిరాలు నిర్వహించాలి.",
    "pdf":
      "📄 **PDF Generation Started…**\n\nYour MoM PDF includes:\n• Meeting header & meta\n• Full participant list\n• Discussion notes (EN + Telugu)\n• All 5 action items with deadlines\n• Government format with seal\n\nDownload will be ready in ~15 seconds.",
    "default":
      "I can help you with:\n• **Summarize** today's meeting\n• **Pending** tasks list\n• **Telugu** translation\n• **PDF** report generation\n• **Search** past meetings by topic\n\nTry asking: \"Show dengue meetings from April\"",
  };

  const send=()=>{
    if(!input.trim())return;
    const q=input.toLowerCase();
    setMsgs(m=>[...m,{role:"user",text:input}]);
    setInput("");setTyping(true);
    setTimeout(()=>{
      const key=Object.keys(aiResponses).find(k=>q.includes(k))||"default";
      setMsgs(m=>[...m,{role:"ai",text:aiResponses[key]}]);
      setTyping(false);
    },1200);
  };

  const formatMsg=(text)=>text.split("\n").map((l,i)=>(
    <span key={i}>{l.replace(/\*\*(.*?)\*\*/g,(_,t)=>t).split(/(\*\*.*?\*\*)/).map((p,j)=>
      p.startsWith("**")&&p.endsWith("**")
        ?<strong key={j} style={{color:"var(--accent)"}}>{p.slice(2,-2)}</strong>
        :p
    )}<br/></span>
  ));

  const suggestions=["Summarize today's meeting","Show pending tasks","Translate to Telugu","Generate PDF report","Show dengue meetings"];

  return(
    <div style={{maxWidth:680,margin:"0 auto"}}>
      <div className="card animate-fade-up">
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <div style={{width:36,height:36,background:"linear-gradient(135deg,var(--accent),#e8891a)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🤖</div>
          <div>
            <div style={{fontFamily:"var(--font-display)",fontWeight:700}}>MeetIQ Assistant</div>
            <div style={{fontSize:10,color:"var(--green)"}}>● Online · AI-Powered</div>
          </div>
          <div className="status-pill status-live" style={{marginLeft:"auto"}}>GPT-4 Turbo</div>
        </div>

        <div className="chat-container">
          <div className="chat-messages">
            {msgs.map((m,i)=>(
              <div key={i} className={`chat-msg${m.role==="user"?" user":""}`}>
                <div className={`chat-avatar${m.role==="ai"?" chat-ai-avatar":" chat-user-avatar"}`}>{m.role==="ai"?"🤖":"U"}</div>
                <div className={`chat-bubble${m.role==="ai"?" chat-ai":" chat-user-msg"}`}>{formatMsg(m.text)}</div>
              </div>
            ))}
            {typing&&(
              <div className="chat-msg">
                <div className="chat-avatar chat-ai-avatar">🤖</div>
                <div className="chat-bubble chat-ai">
                  <div className="ai-thinking">
                    <span className="dot-blink" style={{fontSize:18}}>●</span>
                    <span className="dot-blink" style={{fontSize:18}}>●</span>
                    <span className="dot-blink" style={{fontSize:18}}>●</span>
                  </div>
                </div>
              </div>
            )}
            <div ref={endRef}/>
          </div>
          <div style={{marginBottom:8,display:"flex",gap:6,flexWrap:"wrap"}}>
            {suggestions.map(s=>(
              <button key={s} className="btn btn-ghost btn-sm" style={{fontSize:10}} onClick={()=>{setInput(s)}}>{s}</button>
            ))}
          </div>
          <div className="chat-input-row">
            <input className="form-input" style={{flex:1}} placeholder="Ask about meetings, actions, summaries…" value={input}
              onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
            <button className="btn btn-primary btn-sm" onClick={send}>Send ⚡</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---- APP ---- */
const PAGES={
  dashboard:{title:"Dashboard",comp:Dashboard},
  newmeeting:{title:"New Meeting",comp:NewMeeting},
  live:{title:"Live Session",comp:LiveSession},
  transcripts:{title:"Transcripts",comp:()=><Archive/>},
  summaries:{title:"AI Summaries",comp:Summaries},
  mom:{title:"Minutes of Meeting",comp:MoM},
  slides:{title:"Slide Captures",comp:SlideCaptures},
  archive:{title:"Meeting Archive",comp:Archive},
  actions:{title:"Action Items",comp:ActionItems},
  analytics:{title:"Analytics",comp:Analytics},
  chat:{title:"AI Assistant",comp:AIChat},
  settings:{title:"Settings",comp:Settings},
};

function App(){
  const [active,setActive]=useState("dashboard");
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [showNotif,setShowNotif]=useState(false);
  const page=PAGES[active]||PAGES.dashboard;
  const Comp=page.comp;
  return(
    <>
      <Sidebar active={active} setActive={setActive} sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen}/>
      <div className="main-content">
        <TopBar title={page.title} setSidebarOpen={setSidebarOpen} setShowNotif={setShowNotif}/>
        <div className="page-content">
          <Comp setActive={setActive}/>
        </div>
      </div>
      {showNotif&&<NotifPanel onClose={()=>setShowNotif(false)}/>}
      {showNotif&&<div style={{position:"fixed",inset:0,zIndex:140}} onClick={()=>setShowNotif(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
